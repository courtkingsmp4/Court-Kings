function audioInit(){try{if(AC){AC.state=='suspended'&&AC.resume();return}AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();sg=AC.createGain();cg=AC.createGain();[mg,sg,cg].forEach(g=>g.connect(AC.destination));nb=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const n=AC.createBufferSource(),f=AC.createBiquadFilter();n.buffer=nb;n.loop=true;f.type='lowpass';f.frequency.value=450;n.connect(f);f.connect(cg);n.start();setInterval(music,250);vol()}catch(e){AC=null}}
